[project]
name = "meeseek-pack-gcp"
version = "0.1.0"
description = "Google Cloud for meeseek: logs, GKE pods and events, Monitoring alerts over MCP"
requires-python = ">=3.11"
dependencies = ["meeseek-pack-kit", "google-auth>=2.54.0"]

[project.scripts]
meeseek-pack-gcp = "meeseek_pack_gcp.__main__:main"

[tool.uv.sources]
meeseek-pack-kit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meeseek_pack_gcp"]
