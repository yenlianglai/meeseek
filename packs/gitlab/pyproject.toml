[project]
name = "meeseek-pack-gitlab"
version = "0.1.0"
description = "GitLab for meeseek: MRs, pipelines, issues and code over MCP"
requires-python = ">=3.11"
dependencies = ["meeseek-pack-kit"]

[project.scripts]
meeseek-pack-gitlab = "meeseek_pack_gitlab.__main__:main"

[tool.uv.sources]
meeseek-pack-kit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meeseek_pack_gitlab"]
