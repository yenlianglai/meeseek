[project]
name = "meeseek-pack-kit"
version = "0.1.0"
description = "What a meeseek pack is made of: tools with declared effects, served over MCP stdio"
requires-python = ">=3.11"
dependencies = ["mcp>=1.27.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meeseek_pack_kit"]
