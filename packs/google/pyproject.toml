[project]
name = "meeseek-pack-google"
version = "0.1.0"
description = "Google Workspace for meeseek: Gmail, Chat, Drive and Calendar (read-only) over MCP"
requires-python = ">=3.11"
dependencies = ["meeseek-pack-kit", "google-api-python-client>=2.197.0", "google-auth>=2.54.0"]

[project.scripts]
meeseek-pack-google = "meeseek_pack_google.__main__:main"

[tool.uv.sources]
meeseek-pack-kit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meeseek_pack_google"]
