[project]
name = "meeseek-pack-jira"
version = "0.1.0"
description = "Jira for meeseek: search, read and sprint tickets over MCP"
requires-python = ">=3.11"
dependencies = ["meeseek-pack-kit"]

[project.scripts]
meeseek-pack-jira = "meeseek_pack_jira.__main__:main"

[tool.uv.sources]
meeseek-pack-kit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meeseek_pack_jira"]
