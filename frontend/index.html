  <body>
    <!--
    THESIS: One calm, dense workbench where you talk to the agent team and can
    always see what it actually did. Each agent is summoned for one task and is
    gone when it is done: the console shows the task, its steps and its result,
    and nothing that is not about them.
    OWN-WORLD: meeseek — a terminal-flavoured ops console in light and dark.
    Geist for what people read, Geist Mono for what machines write (ids, paths,
    tool names, status). One signal colour (#1F6FB2 light, #6CC4FF dark) for
    what is live, selected or clickable; hairlines, 8px controls. The mark is
    one task in brackets, done.
    STORY: Open → last session resumes → ask → watch the answer stream with its
    steps folded inline → open what it produced → approve what it wants to do.
    FORM: tech and geek, readable first; English UI.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
