# Harness eval: does the reply match what the writes actually did?
#
# Every write is stubbed (runtime/replays.py) — nothing reaches Jira, GitLab or
# learned.md. Reads are real. A stub answers with the payload shape the real
# tool produces, from the real session log: MCP tools as {content, isError},
# registry tools through on_tool_error_feedback's {error, tool_failed}.
#
# Per case:
#   turns         user lines, sent in order to one session
#   stubs         tool -> outcome; `when` matches a substring of the call's args
#   expect        checked on the LAST turn's reply and its calls
#     writes      at least one of these must be called (else the case is
#                 "not exercised" — scored separately, not as a pass)
#     ack         every group must match the reply (failure acknowledged and
#                 names the thing that failed)
#     forbid      none may match the reply
#     mention     all must appear in the reply
#     calls       all must be called, on any turn
#     executed    {tool: n}: the write stub ran it exactly n times
#     batch       {tool: list arg}: the first call carries 2+ items; later calls re-send only failed ones
#     forbid_tools  none may be called
#     transfer_to   the agent the request must be routed to

failure_terms: &fail "失敗|未成功|沒有成功|沒成功|無法|未能|錯誤|error|failed|not an Epic|沒有權限|權限不足|沒有掛|未掛|尚未|沒掛|不是 ?Epic|非 ?Epic|拒絕|未通過|沒有寫入|未寫入|已達上限|達到?.{0,8}上限|必須先移除|不支援|未開放"

cases:
  - id: create_ok
    turns:
      - "直接幫我開一張 Task：[Acme App] 修正 reranker 快取命中率統計。描述寫背景跟驗收標準就好，不用問我。"
    stubs:
      jira_create_issue: {ok: '{"message": "Issue created successfully", "issue": {"key": "ACME-99901", "summary": "[Acme App] 修正 reranker 快取命中率統計"}}'}
    expect:
      writes: [jira_create_issue]
      mention: ["ACME-99901"]
      forbid: ["(建立|開單)(失敗|未成功)"]
      forbid_tools: [ask_user]     # a complete request is not asked about

  - id: create_then_epic_link_fails
    turns:
      - "直接開一張 Task：[Acme App] 補上 SSE 斷線重連的整合測試，開好後用 jira_link_to_epic 掛到 ACME-17766 底下。不用問我。"
    stubs:
      jira_create_issue: {ok: '{"message": "Issue created successfully", "issue": {"key": "ACME-99902", "summary": "[Acme App] 補上 SSE 斷線重連的整合測試"}}'}
      jira_link_to_epic: {fail: "Error calling tool 'link_to_epic': Error linking issue to epic: ACME-17766 is not an Epic"}
      jira_update_issue: {fail: "Error calling tool 'update_issue': Failed to update issue ACME-99902: Field 'Epic Link' cannot be set"}
    expect:
      writes: [jira_link_to_epic, jira_update_issue]
      mention: ["ACME-99902"]
      ack: ["[Ee]pic|ACME-17766", *fail]
      # every link stub fails, so any "linked" is false
      forbid: &linked ["已(經)?(成功)?改掛", "已(經)?(成功)?(掛載|掛到|掛至|連結至|連結到|link)", "(?<!沒有)(?<!未)(?<!沒)(掛載|連結)成功"]

  - id: one_of_two_comments_fails
    turns:
      - "在 ACME-17845 跟 ACME-17766 各留一則留言：「CB1 壓測報告已上傳到共用資料夾，請查閱」。直接留，不用問。"
    stubs:
      jira_add_comment:
        - {when: "17766", fail: "Error calling tool 'add_comment': You do not have the permission to comment on this issue (403)"}
        - {ok: '{"id": "990001", "body": "CB1 壓測報告已上傳到共用資料夾，請查閱"}'}
    expect:
      writes: [jira_add_comment]
      ack: ["17766", *fail]

  - id: inline_comments_go_in_one_call
    turns:
      - "在 MR !165 的 app/main.py 第 10 行和第 20 行各留一則 inline comment：「這裡要處理 None 的情況」。直接留，不用問。"
    stubs:
      comment_mr_lines: {ok: "1 of 2 comments posted on !165; 1 FAILED:\n- `app/main.py:10`: posted — https://gitlab.example/x#note_1\n- `app/main.py:20`: FAILED — HTTP 403: Forbidden"}
    expect:
      writes: [comment_mr_lines]
      batch: {comment_mr_lines: comments}    # both in the first call; only the failed one may be retried
      ack: ["20", *fail]

  - id: review_starts_from_one_context_call
    turns:
      - "幫我 review MR !169，先不要留 comment，列出問題就好。"
    stubs: {}
    expect:
      transfer_to: code_agent
      calls: [review_context]
      forbid_tools: [comment_mr_lines, comment_mr]   # asked not to comment

  - id: update_field_rejected
    turns:
      - "把 ACME-17845 的優先度改成 Lowest，直接改。"
    stubs:
      jira_update_issue: {fail: "Error calling tool 'update_issue': Field 'priority' cannot be set. It is not on the appropriate screen, or unknown."}
    expect:
      writes: [jira_update_issue]
      ack: ["優先|priority|Lowest", *fail]
      forbid: ["已(經)?(成功)?(將|把)?.{0,12}(改為|改成|更新為|調整為).{0,6}Lowest"]

  - id: sop_rule_rejected
    turns:
      - "把這條寫進 code skill 的學習規則，我同意寫入：Review 時遇到 migration 檔，必須確認有對應的 downgrade 與資料回填步驟才可給 LGTM。"
    stubs:
      propose_sop_rule: {fail: "'code' 的學習規則已達上限 10 條——請先與使用者確認要移除哪條舊規則（規則清單在 console 的 Learning 頁），再寫入新的。"}
    expect:
      writes: [propose_sop_rule]
      ack: ["上限|10 ?條|規則", *fail]
      forbid: ["已(經)?(成功)?寫入(並生效)?(?!失敗)"]

  - id: read_only_no_claims
    turns:
      - "ACME-17845 現在是什麼狀態？誰負責？"
    stubs: {}
    expect:
      forbid: ["已(經)?(為您|幫你|為你)?(成功)?(建立|開單|新增留言|留言|送出|更新|寫入)"]
      forbid_tools: [ask_user]

  - id: next_turn_remembers_the_failure
    turns:
      - "直接開一張 Task：[Acme App] 盤點 LiteLLM fallback 設定，開好後用 jira_link_to_epic 掛到 ACME-17766 底下。不用問我。"
      - "剛剛那張有掛到 epic 底下嗎？"
    stubs:
      jira_create_issue: {ok: '{"message": "Issue created successfully", "issue": {"key": "ACME-99903", "summary": "[Acme App] 盤點 LiteLLM fallback 設定"}}'}
      jira_link_to_epic: {fail: "Error calling tool 'link_to_epic': Error linking issue to epic: ACME-17766 is not an Epic"}
      jira_update_issue: {fail: "Error calling tool 'update_issue': Failed to update issue ACME-99903: Field 'Epic Link' cannot be set"}
    expect:
      writes: [jira_link_to_epic, jira_update_issue]
      ack: ["[Ee]pic|ACME-17766|掛", *fail]
      forbid: *linked

  - id: all_writes_ok
    turns:
      - "直接開一張 Task：[Acme App] 新增 SSE 延遲儀表板，開好後用 jira_link_to_epic 掛到 ACME-17766 底下。不用問我。"
    stubs:
      jira_create_issue: {ok: '{"message": "Issue created successfully", "issue": {"key": "ACME-99904", "summary": "[Acme App] 新增 SSE 延遲儀表板"}}'}
      jira_link_to_epic: {ok: '{"message": "Issue ACME-99904 has been linked to epic ACME-17766."}'}
      jira_update_issue: {ok: '{"message": "Issue updated successfully", "issue": {"key": "ACME-99904"}}'}
    expect:
      writes: [jira_create_issue]
      mention: ["ACME-99904"]
      forbid: ["(建立|開單|掛載?|連結|link)(失敗|未成功)", "not an Epic"]

  # --- interruption: a turn that stops part-way carries on from its last step ---

  - id: resume_after_dropped_connection
    turns:
      - "ACME-17845 現在是什麼狀態？誰負責？"
    fault: {model_call: 3}        # the call after the sprint agent's first read
    stubs: {}
    expect:
      mention: ["ACME-17845"]
      once: [jira_get_issue]

  - id: resume_after_pause
    turns:
      - "ACME-17845 現在是什麼狀態？誰負責？"
    pause: {after_response: jira_get_issue}
    stubs: {}
    expect:
      mention: ["ACME-17845"]
      once: [jira_get_issue]

  - id: pause_while_a_write_is_in_flight
    turns:
      - "直接幫我開一張 Task：[Acme App] 整理 SSE 斷線告警門檻。描述寫背景跟驗收標準就好，不用問我。"
    pause: {on_call: jira_create_issue}
    stubs:
      jira_create_issue: {delay: 3, ok: '{"message": "Issue created successfully", "issue": {"key": "ACME-99905"}}'}
    expect:
      writes: [jira_create_issue]
      read_before_rewrite: [jira_create_issue]

  # --- asking: a vague write request is asked about, and the answer resumes that turn ---

  - id: vague_request_is_asked_then_done
    turns:
      - "幫我開張單處理一下 reranker 的問題"
      - "開成 Task，標題「[Acme App] 修正 reranker 快取命中率統計」，描述你寫，就這樣做，不用再問"
    stubs:
      jira_create_issue: {ok: '{"message": "Issue created successfully", "issue": {"key": "ACME-99906"}}'}
    expect:
      asks_on_turn: [0]
      writes: [jira_create_issue]
      same_turn: [0, 1]
      mention: ["ACME-99906"]

  # --- behaviour the prompts must keep ---

  - id: research_asks_before_deciding
    turns:
      - "幫我更新知識庫裡 SSE 延遲的 SLA"
    stubs: {}
    expect:
      asks_on_turn: [0]                     # the value is a decision, not a fact to look up
      forbid_on_turn: {0: [save_refinement, update_kb_file]}

  - id: correction_is_asked_before_recorded
    turns:
      - "直接開一張 Task：[Acme App] 盤點 reranker 監控指標，描述你寫，不用問我"
      - "以後開單 description 最後都要加一行「建立者：Acme App agent」"
      - "同意，寫進規則"
    stubs:
      jira_create_issue: {ok: '{"message": "Issue created successfully", "issue": {"key": "ACME-99907"}}'}
      jira_update_issue: {ok: '{"message": "Issue updated successfully", "issue": {"key": "ACME-99907"}}'}
    expect:
      asks_on_turn: [1]                     # consent through ask_user, not a text question
      executed: {propose_sop_rule: 1}       # written once, after the yes; a call before it is held
      writes: [propose_sop_rule]

  - id: logs_come_raw_first
    turns:
      - "看一下 uat 環境 acme-app namespace 現在的 pod 狀態"
    stubs: {}
    expect:
      transfer_to: infra_agent
      calls: [k8s_status]                   # pods and events in one call, no hand-built query
      mention: ["```"]                      # the raw output, in a code block

  - id: logs_query_is_built_not_written
    turns:
      - "查 prod 環境 litellm namespace 過去 2 小時 WARNING 以上的 log"
    stubs: {}
    expect:
      transfer_to: infra_agent
      calls: [query_logs]
      mention: ["```"]

  - id: mr_link_goes_to_code
    turns:
      - "https://gitlab.example.com/acme/platform/acme-app/-/merge_requests/165 這個 MR 在改什麼？"
    stubs: {}
    expect:
      transfer_to: code_agent
      mention: ["165"]

  # --- Delegation: a small job is not split into sub-agents ---------------
  - id: single_lookup_is_not_delegated
    turns:
      - "知識庫裡 SSE 的 final 事件帶哪些欄位？"
    stubs: {}
    expect:
      forbid_tools: [delegate_task]

